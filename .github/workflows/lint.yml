name: Lint

# Runs on every push to main/dev and on every pull request targeting them.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      # ruff checks for common bugs, unused imports, style issues, etc.
      - name: Run ruff
        run: ruff check .

      # black --check fails the build if code isn't formatted, without rewriting files.
      - name: Run black (check only)
        run: black --check .