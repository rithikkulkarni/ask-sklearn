chunking:
  chunk_size_tokens: 400
  chunk_overlap_tokens: 50
  tokenizer_encoding: cl100k_base
  module_label_prefix: "module:"

embedding:
  model: text-embedding-3-small
  batch_size: 100

vector_store:
  collection_name: sklearn_issue_chunks
  vector_size: 1536
  distance: Cosine
  host: localhost
  port: 6333

retrieval:
  overfetch_k: 30           # candidates pulled from Qdrant before filtering/thresholding
  score_threshold: 0.60     # minimum cosine similarity to keep a hit (tune via eval harness)
  min_k: 1                  # floor — avoid returning zero results if nothing clears the threshold
  max_k: 10                 # ceiling — cap how many chunks ever get passed to generation, even if many clear the threshold
  filter_fields:
    - component
    - version

generation:
  model: gpt-4o-mini
  temperature: 0.1
  min_top_score: 0.60       # pre-LLM refusal cutoff on the top hit's score — separate from
                             # retrieval.score_threshold, which is tuned for relevance, not
                             # "good enough to generate an answer from"

eval:
  judge_model: gemini-3.5-flash-lite   # deliberately not gpt-4o-mini, to avoid the
                                        # generator judging its own answers (self-preference bias)
  judge_temperature: 0.0

api:
  rate_limit: "20/minute"   # per-IP, enforced before any paid OpenAI/Gemini call
